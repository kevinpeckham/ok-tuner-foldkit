<!doctype html>
<!--
  index.html: the page the browser loads, and the entry point of the build.

  Where this file sits. Vite treats it as the root of the app. It follows the
  stylesheet link and the script tag below, compiles what they point at, and
  in a production build rewrites both to point at hashed files under /assets/.
  The page that Foldkit draws is not in this file. The body holds one empty
  container, and the Foldkit runtime renders the view (src/view.ts) there.
  This is the client-rendered shape described in FOLDKIT.md, "File
  Organization".

  Read next: src/entry.ts, which the script tag loads.
-->
<!--
  lang="en": a Foldkit view can set the page's language through the Document
  it returns. Ours does not, so the runtime leaves this value as it is.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A link to a source file, not to built CSS. In development Vite serves
      it compiled by the Tailwind plugin (vite.config.ts). In a build the
      compiled CSS is written to a hashed file and this link is rewritten to
      it. The file itself explains the theme.
    -->
    <link href="/src/styles.css" rel="stylesheet" />
    <!--
      The site icon, three ways. The files are in public/, which Vite serves
      at the site root and copies into dist/ as they are. The SVG is for
      browsers that accept an SVG icon and the 48px PNG for those that do
      not. The apple-touch-icon is what a phone's home screen shows. How they
      were made, and why the SVG needed a fix: FINDINGS.md, "An SVG that a
      browser draws inline can still fail as an image".
    -->
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Asks search engines not to index the site while it is not yet public.
      vercel.json says the same thing a second way, as an X-Robots-Tag header
      on every response. Making the site crawlable means removing both
      (docs/backlog.md, "Make the page crawlable").
    -->
    <meta name="robots" content="noindex" />
    <!--
      The title the tab shows before the script has run. The view returns
      the same text as its Document title, and the runtime keeps
      document.title set to that. Change the two together.
    -->
    <title>OK Tuner | Chromatic Instrument Tuner</title>
  </head>
  <body>
    <!--
      The container. src/entry.ts passes this element to
      Runtime.makeApplication as `container`. On the first render the root
      element of the view (the <main> in src/view.ts) takes this div's place,
      so once the app is running there is no #root in the page.
    -->
    <div id="root"></div>
    <!--
      Loads the app. type="module" lets the file use imports. The src is a
      TypeScript file: Vite compiles it as it is requested in development,
      and in a build bundles it with everything it imports into one hashed
      JavaScript file and rewrites this tag. entry.ts starts error reporting,
      then creates the Foldkit runtime and runs it.
    -->
    <script type="module" src="./src/entry.ts"></script>
  </body>
</html>
